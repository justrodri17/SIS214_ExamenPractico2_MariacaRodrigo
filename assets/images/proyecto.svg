<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Fondo del diagrama -->
  <rect width="800" height="450" fill="#0f172a" rx="10"/>
  
  <!-- Título principal -->
  <text x="400" y="45" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    ESQUEMA ENTIDAD - RELACIÓN (SaludDigital - 3FN)
  </text>

  <!-- Tabla PACIENTE -->
  <g transform="translate(60, 90)">
    <rect width="200" height="150" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="6"/>
    <rect width="200" height="35" fill="#3b82f6" rx="6"/>
    <text x="100" y="23" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">PACIENTE</text>
    <text x="15" y="60" fill="#94a3b8" font-family="sans-serif" font-size="12">🔑 id_paciente (PK)</text>
    <text x="15" y="85" fill="#e2e8f0" font-family="sans-serif" font-size="12">nombre_completo</text>
    <text x="15" y="110" fill="#e2e8f0" font-family="sans-serif" font-size="12">ci_identidad</text>
    <text x="15" y="135" fill="#e2e8f0" font-family="sans-serif" font-size="12">fecha_nacimiento</text>
  </g>

  <!-- Tabla CITA_MEDICA -->
  <g transform="translate(300, 240)">
    <rect width="200" height="160" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="6"/>
    <rect width="200" height="35" fill="#10b981" rx="6"/>
    <text x="100" y="23" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CITA_MEDICA</text>
    <text x="15" y="60" fill="#94a3b8" font-family="sans-serif" font-size="12">🔑 id_cita (PK)</text>
    <text x="15" y="85" fill="#6366f1" font-family="sans-serif" font-size="12">🔗 id_paciente (FK)</text>
    <text x="15" y="110" fill="#6366f1" font-family="sans-serif" font-size="12">🔗 id_medico (FK)</text>
    <text x="15" y="135" fill="#e2e8f0" font-family="sans-serif" font-size="12">fecha_hora</text>
  </g>

  <!-- Tabla MEDICO -->
  <g transform="translate(540, 90)">
    <rect width="200" height="150" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" rx="6"/>
    <rect width="200" height="35" fill="#8b5cf6" rx="6"/>
    <text x="100" y="23" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MEDICO</text>
    <text x="15" y="60" fill="#94a3b8" font-family="sans-serif" font-size="12">🔑 id_medico (PK)</text>
    <text x="15" y="85" fill="#e2e8f0" font-family="sans-serif" font-size="12">nombre_medico</text>
    <text x="15" y="110" fill="#e2e8f0" font-family="sans-serif" font-size="12">especialidad</text>
    <text x="15" y="135" fill="#e2e8f0" font-family="sans-serif" font-size="12">matricula_prof</text>
  </g>

  <!-- Líneas de Relación -->
  <path d="M 160 240 L 160 320 L 300 320" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  <path d="M 640 240 L 640 320 L 500 320" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,5" fill="none"/>

  <!-- Indicadores de Cardinalidad -->
  <text x="170" y="260" fill="#38bdf8" font-family="sans-serif" font-size="11">1</text>
  <text x="280" y="315" fill="#38bdf8" font-family="sans-serif" font-size="11">N</text>
  <text x="630" y="260" fill="#a78bfa" font-family="sans-serif" font-size="11">1</text>
  <text x="510" y="315" fill="#a78bfa" font-family="sans-serif" font-size="11">N</text>
</svg>
